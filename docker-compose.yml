version: '3.8'

networks:
   dev:

services:
  postgres:
    image: postgres:15
    container_name: 'server_focus_zone'
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Roman13_D14AR
      POSTGRES_DB: cafe_db
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
        - dev

  redis: 
    image: redis:latest
    container_name: redis
    ports: 
      - "6379:6379"
    networks:
      - dev

  server:
    build: 
      context: server
      dockerfile: Dockerfile
    ports: 
      - "4000:4000"
    volumes: 
      - .:/usr/src/app
    depends_on: 
      - postgres
      - redis
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: Roman13_D14AR
      DATABASE_NAME: cafe_db
      DATABASE_URL: postgresql://Roman13_D14AR:postgres@db:5432/cafe_db
      REDIS_HOST: redis
      REDIS_PORT: 6379  
    command: sh -c "npx prisma migrate dev --name init && npm run start:dev"
    networks:
      - dev

  frontend:
    build:
      context: ./focuszone
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./focuszone:/usr/src/app
    networks:
      - dev

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    depends_on:
      - server
      - frontend
      - redis
      - postgres
    volumes:
      - '.nginx.conf:/etc/nginx/nginx.conf'
    networks:
      - dev
  
volumes:
  pgdata:
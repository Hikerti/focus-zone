version: '3.8'

networks:
  prod_net:

services:
  postgres:
    image: postgres:15
    container_name: 'server_focus_zone'
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Roman13_D14AR
      POSTGRES_DB: focuszone
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
        - prod_net

  redis: 
    image: redis:latest
    container_name: redis
    environment:
      REDIS_PORT: 6379
    ports: 
      - "6379:6379"
    networks:
      - prod_net

  server:
    build: 
      context: ./server
    ports: 
      - "4000:4000"
    volumes: 
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
    depends_on: 
      - postgres
      - redis
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: Roman13_D14AR
      DATABASE_NAME: focuszone
      DATABASE_URL: postgresql://postgres:Roman13_D14AR@db:5432/focuszone

      REDIS_HOST: redis
      REDIS_PORT: 6379
    command: ["npm", "run", "start:dev"]
    networks:
      - prod_net

  frontend:
    build:
      context: ./focuszone
    container_name: frontend
    volumes:
      - ./focuszone:/usr/src/app
    networks:
      - prod_net

  nginx:
    image: nginx:stable-alpine
    ports:
      - "80:80"
    depends_on:
      - server
      - frontend
      - redis
      - postgres
    volumes:
      - './nginx.conf:/etc/nginx/nginx.conf'
    networks:
      - prod_net
  
volumes:
  pgdata: